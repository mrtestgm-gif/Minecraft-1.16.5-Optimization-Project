<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#161022">
  <title>Clever | Portal</title>
  <link rel="icon" type="image/svg+xml" href="./clever-favicon.svg">
  <link rel="alternate icon" href="https://assets.clever.com/favicon.ico">
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{min-height:100vh;min-height:100dvh;margin:0;padding:20px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 15%,#3c285f,#171020 60%,#0f0b16);color:#f9f7ff}
    main{width:min(100%,460px);text-align:center;background:#21172ee8;border:1px solid #4c3b64;border-radius:20px;padding:36px 25px;box-shadow:0 18px 75px #0006}
    .small{color:#d7bdff;font-size:12px;font-weight:750;letter-spacing:.18em;text-transform:uppercase}
    h1{font-size:clamp(26px,6vw,38px);margin:13px 0 8px;letter-spacing:-.04em}
    p{color:#bcb0cf;margin:0 0 28px;line-height:1.55}
    button{display:block;width:100%;margin:11px 0;padding:16px;border-radius:12px;border:1px solid #9f7ad9;color:white;background:#68449e;font-size:16px;font-weight:700;cursor:pointer}
    button:hover{background:#7f58ba}
    a{display:inline-block;color:#dbbfff;margin-top:16px;font-size:14px;text-underline-offset:3px}
    #message{min-height:18px;font-size:13px;color:#ffce95;margin-top:20px}
    .fine{font-size:11px;color:#898099;margin:12px 0 0;line-height:1.5}
  </style>
</head>
<body>
  <main>
    <div class="small">CLARK COUNTY SMP</div>
    <h1>Minecraft 1.16.5</h1>
    <p>Choose how to launch the client.</p>
    <button id="blank" type="button">Open in about:blank</button>
    <button id="blob" type="button">Open in blob: tab</button>
    <a href="./game.html" target="_blank" rel="noopener">Launch normally instead</a>
    <div id="message" role="status" aria-live="polite"></div>
    <p class="fine">These modes still load the client from this website and do not bypass browser or network restrictions. Use the direct link if the client cannot run in an iframe.</p>
  </main>
  <script>
  (()=>{
    'use strict';
    const gameURL=new URL('./game.html',document.baseURI).href;
    const iconURL=new URL('./clever-favicon.svg',document.baseURI).href;
    const esc=s=>s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
    const message=document.getElementById('message');
    const wrapper='<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clever | Portal</title><link rel="icon" type="image/svg+xml" href="'+esc(iconURL)+'"><link rel="alternate icon" href="https://assets.clever.com/favicon.ico"><style>html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe title="Minecraft" src="'+esc(gameURL)+'" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe></body></html>';
    function failed(){message.textContent='Your browser blocked the tab. Allow popups or launch normally.';}
    document.getElementById('blank').addEventListener('click',()=>{
      const tab=window.open('about:blank','_blank');
      if(!tab){failed();return;}
      try{tab.document.open();tab.document.write(wrapper);tab.document.close();tab.opener=null;message.textContent='Opened in an about:blank tab.';}
      catch(e){message.textContent='Could not open the blank tab. Launch normally instead.';try{tab.close()}catch(_){}}
    });
    document.getElementById('blob').addEventListener('click',()=>{
      const url=URL.createObjectURL(new Blob([wrapper],{type:'text/html'}));
      const tab=window.open(url,'_blank');
      if(!tab){URL.revokeObjectURL(url);failed();return;}
      try{tab.opener=null}catch(e){}
      setTimeout(()=>URL.revokeObjectURL(url),60000);
      message.textContent='Opened in a blob: tab.';
    });
  })();
  </script>
</body>
</html>
